name: build

# 构建两套产物：
#   - 命令行版发行包（TUI + Web + 后端 + Agent），Linux runner
#   - Windows 桌面版安装包（NSIS .exe），Windows runner
#
#   推送到 main / align-plugins  → 构建并上传 artifact
#   推 v* tag                    → 构建并发布 GitHub Release
#   手动 dispatch                → 构建；填了 release_tag 则同时发布 Release
on:
  push:
    branches: [main, align-plugins]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 写进 install.sh 与 latest.json 的下载根地址
        required: false
        type: string
      release_tag:
        description: 非空则用该 tag 发布 Release（例如 v3.14.3）
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 与 mise.toml 保持一致：engines.node 要求 >= 24，pnpm 由 lockfile 决定。
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"
  # build:zcode 必须拿到下载根地址才能生成 install.sh / latest.json。
  # 优先用 dispatch 入参，其次用仓库变量（Settings → Secrets and variables → Actions → Variables）。
  # 注意：GitHub Release 的资产是平铺的，这个地址应指向具备
  #「latest.json + releases/<版本>/<包>」布局的静态托管；只想下载安装包的话用
  # Release 里附带的 install-from-release.sh。
  ZCODE_DIST_BASE_URL: ${{ inputs.base_url || vars.ZCODE_DIST_BASE_URL || 'https://downloads.example.com/zcode/' }}
  # 迁移 checksum 直接哈希源码文本，CRLF 会让产物算出的值与已有数据库账本不一致。
  # .gitattributes 已固定 LF（eol 规则优先于 core.autocrlf），两个 runner 都应是 LF。
  GUARD: node scripts/ci/assert-migration-baseline.mjs

jobs:
  build:
    name: 命令行版发行包
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 迁移基线断言
        run: ${{ env.GUARD }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 构建命令行版发行包
        run: pnpm build:zcode --base-url "$ZCODE_DIST_BASE_URL"

      - name: 汇总产物信息
        run: |
          {
            echo "## 命令行版发行包"
            echo
            for f in dist/zcode/releases/*/sha256.txt; do
              [ -f "$f" ] && echo '```' && cat "$f" && echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传发行包
        uses: actions/upload-artifact@v7
        with:
          name: zcode-dist
          path: |
            dist/zcode/releases/
            dist/zcode/latest.json
            dist/zcode/install.sh
          if-no-files-found: error

  desktop-windows:
    name: Windows 桌面安装包
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Windows runner 默认 core.autocrlf=true，但 .gitattributes 的 eol=lf 优先，
      # 检出仍应是 LF —— 这一步正好把这个前提钉住，顺带验证修复在 Windows 上成立。
      - name: 迁移基线断言
        run: ${{ env.GUARD }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Windows 桌面安装包
        env:
          # 产品身份与后端环境由 ZCODE_ENV 决定（见 desktop-product-identity.mjs）：
          # 非 production 时 appId 变成 dev.zcode.app.preview、productName 变成
          # 「ZCode Preview」、产物名带 _TEST 后缀，得到一个可与正式版并排安装的预览包，
          # 不能接管正式安装与数据。要出正式 ZCode 包必须显式给 production。
          ZCODE_ENV: production
          ZCODE_COMMIT: ${{ github.sha }}
          # 桌面安装包不依赖 mock-cdn remote 资产；跳过它可省掉跨平台资源的下载与打包，
          # 这是仓库为此场景预留的开关（见 prepare-runtime-assets.mjs）。
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          # electron-builder 在 CI 里发现 git tag 会自动 publish（配置里的 generic provider
          # 只是占位，指向 http://localhost:8081）。bundle.mjs 不转发 --publish 参数，
          # 所以用 electron-publish 读的 GITHUB_REF_TYPE 让它判定为「非 tag 构建」，
          # 从而走"不发布"分支。发布由下面的 release job 用 gh 完成。
          GITHUB_REF_TYPE: branch
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: 汇总产物信息
        shell: bash
        run: |
          {
            echo "## Windows 桌面安装包"
            echo
            echo '```'
            ls -lh packages/desktop/dist/*.exe 2>/dev/null || echo "(未找到 .exe)"
            echo '```'
            echo
            echo "### 打进安装包的插件与技能包"
            echo '```'
            ls packages/desktop/bundled-agents/win32-x64/glm/packages/ 2>/dev/null || echo "(未找到 win32-x64 载荷)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: zcode-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error

      - name: 上传桌面 Agent 载荷
        uses: actions/upload-artifact@v7
        with:
          name: zcode-desktop-agent-payload-win32-x64
          path: packages/desktop/bundled-agents/win32-x64/glm/
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [build, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 取回命令行版产物
        uses: actions/download-artifact@v8
        with:
          name: zcode-dist
          path: dist

      - name: 取回 Windows 安装包
        uses: actions/download-artifact@v8
        with:
          name: zcode-desktop-windows
          path: desktop-win

      - name: 取回桌面 Agent 载荷
        uses: actions/download-artifact@v8
        with:
          name: zcode-desktop-agent-payload-win32-x64
          path: payload

      - name: 组装发布资产
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./dist/latest.json').version")"
          mkdir -p assets
          cp "dist/releases/${VERSION}/zcode-${VERSION}.tar.gz" assets/
          cp "dist/releases/${VERSION}/sha256.txt" assets/
          cp dist/latest.json dist/install.sh scripts/ci/install-from-release.sh assets/
          for f in desktop-win/*; do [ -f "$f" ] && cp "$f" assets/; done
          tar -czf "assets/zcode-${VERSION}-desktop-agent-win32-x64.tar.gz" -C payload .
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la assets/

      - name: 写 Release 说明
        run: |
          set -euo pipefail
          {
            echo "ZCode $RELEASE_TAG（上游 3.14.3 + 插件还原 + LF 修复）"
            echo
            echo "### 校验"
            echo '```'
            cat "assets/sha256.txt"
            echo '```'
            echo
            echo "### 资产"
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`.exe\` | **Windows 桌面版安装包**（NSIS，未签名） |"
            echo "| \`zcode-${VERSION}.tar.gz\` | 命令行版运行包（TUI + Web + 后端 + Agent） |"
            echo "| \`install-from-release.sh\` | 命令行版：直接从这个 Release 安装 |"
            echo "| \`install.sh\` + \`latest.json\` | 需要「latest.json + releases/<版本>/<包>」静态布局时才用得上 |"
            echo "| \`zcode-${VERSION}-desktop-agent-win32-x64.tar.gz\` | 桌面 Agent 载荷（已含在安装包内，单独给出便于替换） |"
            echo
            echo "实际资产："
            echo '```'
            ls -lh assets/
            echo
            echo "### 安装（Windows 桌面版）"
            echo "下载 \`.exe\` 直接双击。**本地构建未签名**，SmartScreen 会拦截：点「更多信息」→「仍要运行」，"
            echo "或先执行 \`Unblock-File <安装包路径>\`。"
            echo
            echo "### 安装（命令行版）"
            echo '```sh'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/install-from-release.sh | sh"
            echo '```'
            echo
            echo "> 国内网络访问 GitHub 可能不通，需要代理时先设 \`https_proxy\` / \`http_proxy\`。"
            echo
            echo "### 打进安装包的插件与技能包"
            echo '```'
            ls payload/ 2>/dev/null && ls payload/packages/ 2>/dev/null
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: 创建或更新 Release
        run: |
          set -euo pipefail
          ASSETS=(assets/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，覆盖资产并刷新说明。"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"
            # 只 upload 不 edit 会留下上一轮的说明：资产换了、说明还写着旧内容。
            # 注意 upload 不会删除多余资产，改过资产集合后要手工清一次旧资产。
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            # --target 固定到本次构建的提交：手动 dispatch 时 tag 还不存在，
            # 不指定的话会拿默认分支的 HEAD，指到别的提交上。
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZCode $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi
          echo "Release 地址：$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
